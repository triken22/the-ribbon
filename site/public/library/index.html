<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Every issue of The Ribbon. Search, filter and download colour or greyscale PDFs.">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- Share cards. Absolute URLs by spec, on the one site origin (docs/DOMAIN.md). -->
<link rel="canonical" href="https://theribbon.fyi/library/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="The Ribbon">
<meta property="og:title" content="Library — The Ribbon">
<meta property="og:description" content="Every issue of The Ribbon. Search, filter and download colour or greyscale PDFs.">
<meta property="og:url" content="https://theribbon.fyi/library/">
<meta property="og:image" content="https://theribbon.fyi/og/default.png">

<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/site.css">
<link rel="preload" href="/fonts/newsreader-normal-400_800-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/ibm-plex-sans-condensed-normal-600-latin.woff2" as="font" type="font/woff2" crossorigin>
<script defer src="/js/pa.js" data-domain="theribbon.fyi"></script>
<link rel="modulepreload" href="/js/data.js">
<link rel="modulepreload" href="/js/parts.js">
<link rel="modulepreload" href="/js/chrome.js">
<script type="module" src="/js/library.js"></script>
</head>
<body class="compact">
<a class="skip" href="#main">Skip to content</a>
<header class="masthead wrap">
  <div class="row">
    <a class="brand" href="/"><span class="t">The Ribbon</span><span class="s">What caught my eye on X this week</span></a>
    <nav class="nav lbl" aria-label="Main"><a href="/">Latest</a><a href="/library/" aria-current="page">Library</a></nav>
  </div>
  <div class="rule3"></div>
</header>
<main id="main" class="wrap inner" aria-busy="true">
  <noscript><p class="note">The library needs JavaScript to list issues.</p></noscript>
  <div class="libhead">
    <h1 class="page-title">Every issue so far</h1>
    <p class="facts libcount" id="libcount"></p>
  </div>
  <div class="libbody">
    <aside class="filters" id="filters" aria-label="Filters">
      <div class="searchbox">
        <label class="lbl" for="q">Search</label>
        <input id="q" class="search" type="search" placeholder="Headline, story, @handle" autocomplete="off" enterkeyhint="search">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      </div>
      <button class="chip filtertoggle" id="ftoggle" type="button" aria-expanded="false" aria-controls="fopts">Filters</button>
      <div class="fopts" id="fopts">
        <fieldset><legend class="lbl">Year</legend><div class="chips" id="years"></div></fieldset>
        <fieldset><legend class="lbl">Section</legend><div class="chips" id="secs"></div></fieldset>
        <fieldset><legend class="lbl">Edition</legend>
          <div class="seg" id="ed"><button type="button" data-v="colour" aria-pressed="true">Colour</button><button type="button" data-v="grey" aria-pressed="false">Greyscale</button></div>
          <p class="ednote" id="ednote" aria-live="polite"></p>
        </fieldset>
        <button class="linkbtn clearbtn" id="clear" type="button" hidden>Clear all filters</button>
      </div>
    </aside>
    <section class="results" aria-label="Issues">
      <div class="rhead" id="rhead">
        <p class="facts" id="count" aria-live="polite"></p>
        <div class="viewrow">
          <span class="sortnote">Newest first</span>
          <div class="seg viewseg" id="view" role="group" aria-label="View"><button type="button" data-v="grid" aria-pressed="true">Covers</button><button type="button" data-v="list" aria-pressed="false">List</button></div>
        </div>
      </div>
      <div id="out"><p class="note" role="status">Loading the issues…</p></div>
    </section>
  </div>
</main>
<footer id="foot" class="foot wrap"></footer>
</body>
</html>
